name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Errors fail the build; `any` warnings are tracked but non-blocking.
      - run: npx eslint app/ --ext .ts,.tsx

  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Content integrity (every shipped guide), retrieval, coordinate/Morse math, backup parsing.
      - run: npm test -- --ci

  expo-doctor:
    name: Expo Doctor + config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Validates config, lockfile, peer deps, native-module support, known regressions.
      # The *patch-version* check is advisory (next step): expo-doctor compares against
      # Expo's LIVE SDK 57 list, so every upstream patch release turned CI red for days.
      - run: npx expo-doctor
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
      # Surfaces drift in the log without blocking. Fix with `npx expo install --check`
      # (or bump what it names) before cutting a release build.
      - name: Dependency drift (advisory)
        run: npx expo install --check
        continue-on-error: true
      # Evaluates app.config.ts (including every config plugin) without a native build.
      - run: npx expo config --type public > /dev/null && echo "app.config.ts evaluates cleanly"
