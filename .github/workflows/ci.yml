name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Errors fail the build; `any` warnings are tracked but non-blocking.
      - run: npx eslint app/ --ext .ts,.tsx

  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Content integrity (every shipped guide), retrieval, coordinate/Morse math, backup parsing.
      - run: npm test -- --ci

  expo-doctor:
    name: Expo Doctor + config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Validates SDK/package alignment and known regressions.
      - run: npx expo-doctor
      # Evaluates app.config.ts (including every config plugin) without a native build.
      - run: npx expo config --type public > /dev/null && echo "app.config.ts evaluates cleanly"
